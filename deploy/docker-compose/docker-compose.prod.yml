version: '3.8'

# ==============================================================================
# AlinkSec 等保 2.0 (三级) 生产环境高可用全栈编排
# 遵循 GB/T 22239-2019 (S3A3G3) 物理/逻辑隔离与高可用规范
# ==============================================================================

networks:
  alinksec-mgmt:
    name: alinksec-mgmt-net
    driver: bridge
  alinksec-dmz:
    name: alinksec-dmz-net
    driver: bridge
  alinksec-data:
    name: alinksec-data-net
    driver: bridge

volumes:
  postgres_data:
    name: alinksec_pg_data
  clickhouse_data:
    name: alinksec_ch_data
  redis_data:
    name: alinksec_redis_data
  nats_data:
    name: alinksec_nats_data
  tamper_vault:
    name: alinksec_tamper_vault

services:
  # ----------------------------------------------------------------------------
  # 1. 基础设施层: PostgreSQL 16 (三权账号、探针纳管、策略持久化)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alinksec-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: alinksec
      POSTGRES_PASSWORD: AlinkSec@2026!
      POSTGRES_DB: alinksec_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - alinksec-data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alinksec -d alinksec_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. 基础设施层: ClickHouse 24.3 (180天等保合规日志防篡改存储)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: alinksec-prod-clickhouse
    restart: always
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - alinksec-data
    ports:
      - "18123:8123"
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. 基础设施层: NATS JetStream 2.10 (全网高可用事件总线)
  # ----------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: alinksec-prod-nats
    restart: always
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    networks:
      - alinksec-mgmt
      - alinksec-data
    ports:
      - "14222:4222"

  # ----------------------------------------------------------------------------
  # 4. 基础设施层: Redis 7 (缓存与滑动窗口频控)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alinksec-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - alinksec-mgmt

  # ----------------------------------------------------------------------------
  # 5. 安全管理中心: 南向控制中枢 (AlinkSec Hub)
  # ----------------------------------------------------------------------------
  alinksec-hub:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.verify
    container_name: alinksec-prod-hub
    restart: always
    environment:
      - ALINKSEC_HUB_PORT=50051
      - ALINKSEC_STORAGE=postgres
      - ALINKSEC_PG_DSN=postgres://alinksec:AlinkSec@2026!@postgres:5432/alinksec_db?sslmode=disable
      - ALINKSEC_CLICKHOUSE_URL=http://clickhouse:8123
      - ALINKSEC_NATS_URL=nats://nats:4222
      - ALINKSEC_LOG_LEVEL=info
    command: ["/app/bin/alinksec-hub"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - alinksec-mgmt
      - alinksec-data
    ports:
      - "50051:50051"

  # ----------------------------------------------------------------------------
  # 6. 安全管理中心: 北向业务控制台 (AlinkSec Manager & 大屏)
  # ----------------------------------------------------------------------------
  alinksec-manager:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.verify
    container_name: alinksec-prod-manager
    restart: always
    environment:
      - ALINKSEC_MANAGER_PORT=8080
      - ALINKSEC_STORAGE=postgres
      - ALINKSEC_PG_DSN=postgres://alinksec:AlinkSec@2026!@postgres:5432/alinksec_db?sslmode=disable
      - ALINKSEC_CLICKHOUSE_URL=http://clickhouse:8123
      - ALINKSEC_NATS_URL=nats://nats:4222
      - ALINKSEC_LOG_LEVEL=info
    command: ["/app/bin/alinksec-manager", "-port=8080"]
    volumes:
      - ../../web:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy
      alinksec-hub:
        condition: service_started
    networks:
      - alinksec-mgmt
      - alinksec-data
    ports:
      - "18080:8080"
